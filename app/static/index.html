<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Reviver</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182230;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#101828;color:white;padding:24px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-size:24px;font-weight:850}.brand span{color:#79e2c2}.sub,.muted{color:#98a2b3;font-size:12px}.wrap{max-width:1160px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{background:white;border:1px solid #e5eaf1;border-radius:15px;padding:18px;box-shadow:0 4px 16px #10182808}.stat small{color:#667085}.stat strong{display:block;font-size:27px;margin-top:7px}.layout{display:grid;grid-template-columns:350px 1fr;gap:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;font:inherit;font-size:13px;background:white}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button,.button{border:0;border-radius:8px;padding:10px 12px;background:#157f68;color:white;font-weight:700;font-size:12px;cursor:pointer}.secondary{background:#eef2f6;color:#344054}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar{align-items:center;margin-bottom:14px}.toolbar h2{margin:0 auto 0 0}.toolbar input{max-width:230px}.toolbar select{max-width:160px}.leads{display:grid;gap:10px}.lead{border:1px solid #e5eaf1;border-radius:11px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.lead h3{margin:0 0 5px;font-size:15px}.detail{color:#667085;font-size:12px;line-height:1.6}.score{font-weight:800;color:#157f68;font-size:12px;margin-top:6px}.empty{padding:28px;text-align:center;color:#667085;border:1px dashed #d0d5dd;border-radius:10px}.notice{font-size:11px;color:#667085;margin-top:12px}.hidden{display:none}#draftBox{margin-top:14px;background:#f2faf7;border:1px solid #bde7d9;border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:13px}.toast{display:none;position:fixed;bottom:18px;right:18px;background:#101828;color:white;padding:12px;border-radius:9px}@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.stats,.row{grid-template-columns:1fr}.lead{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="brand">↗ Lead <span>Reviver</span></div><div class="sub">The next conversation could still close the deal.</div></div><div class="actions"><a class="button secondary" href="/docs">API docs ↗</a><a class="button" href="/api/leads/export.csv">Export CSV ↓</a></div></header>
<main class="wrap"><section class="stats"><div class="stat"><small>Total leads</small><strong id="total">—</strong></div><div class="stat"><small>Stale / never contacted</small><strong id="stale">—</strong></div><div class="stat"><small>Gemini</small><strong id="ai" style="font-size:18px">Checking…</strong></div></section>
<section class="layout"><div class="panel"><h2 id="formTitle">＋ Add a lead</h2><form id="leadForm">
<div class="field"><label>Name *</label><input id="name" required maxlength="160" placeholder="Sam Taylor"></div><div class="row"><div class="field"><label>Email</label><input id="email" type="email" placeholder="sam@company.com"></div><div class="field"><label>Phone</label><input id="phone" placeholder="+1…"></div></div>
<div class="row"><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Source</label><input id="source" placeholder="Referral, website…"></div></div>
<div class="row"><div class="field"><label>Status</label><select id="status"><option>new</option><option>contacted</option><option>engaged</option><option>proposal</option><option>negotiation</option><option>won</option><option>lost</option><option>unqualified</option><option>do_not_contact</option></select></div><div class="field"><label>Deal value</label><input id="deal_value" type="number" min="0" value="0"></div></div>
<div class="row"><div class="field"><label>Last contact</label><input id="last_contact_at" type="date"></div><div class="field"><label>Next follow-up</label><input id="next_follow_up_at" type="date"></div></div>
<div class="field"><label>Conversation notes / context</label><textarea id="notes" maxlength="10000" placeholder="What did they ask? Why did the deal stall?"></textarea></div>
<label style="font-size:12px"><input id="opted_out" type="checkbox" style="width:auto"> Opted out / do not contact</label><div class="actions" style="margin-top:14px"><button id="saveBtn">Save lead</button><button id="cancelEdit" type="button" class="secondary hidden">Cancel edit</button></div></form>
<hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h2>Import leads</h2><form id="importForm"><div class="field"><label>CSV file (max 2 MB)</label><input id="csvFile" type="file" accept=".csv" required></div><button class="secondary">Import CSV</button></form><div class="notice">Your API key stays on the server. Drafts are never sent automatically.</div></div>
<div class="panel"><div class="toolbar"><h2>Your leads</h2><input id="search" placeholder="Search leads…"><select id="filter"><option value="">All statuses</option><option>new</option><option>contacted</option><option>engaged</option><option>proposal</option><option>negotiation</option><option>won</option><option>lost</option><option>unqualified</option><option>do_not_contact</option></select></div><div id="leadList" class="leads"><div class="empty">Loading leads…</div></div><div id="draftBox" class="hidden"></div></div></section></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),fields=['name','email','phone','company','source','status','deal_value','notes','last_contact_at','next_follow_up_at','opted_out'];let editingId=null,leads=[],timer;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}
async function api(url,opt={}){const r=await fetch(url,opt),d=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function refresh(){try{const a=await Promise.all([api('/api/leads?q='+encodeURIComponent($('search').value)+'&status='+encodeURIComponent($('filter').value)),api('/api/metrics'),api('/health')]);leads=a[0];$('total').textContent=a[1].total_leads;$('stale').textContent=a[1].stale_or_never_contacted;$('ai').textContent=a[2].gemini_configured?'Ready ✓':'Add API key';render()}catch(e){toast(e.message)}}
function render(){if(!leads.length){$('leadList').innerHTML='<div class="empty">No leads yet. Add one or import a CSV.</div>';return}$('leadList').innerHTML=leads.map(l=>'<article class="lead"><div><h3>'+esc(l.name)+(l.company?' · '+esc(l.company):'')+'</h3><div class="detail">'+esc(l.email||'No email')+' · '+esc(l.status)+'<br>Deal value: '+Number(l.deal_value||0).toLocaleString()+(l.last_contact_at?' · Last contact '+esc(l.last_contact_at.slice(0,10)):' · Never contacted')+'</div><div class="score">Revival priority '+l.priority.score+'/100</div><div class="detail">'+esc(l.priority.reasons.join(' '))+'</div></div><div class="actions"><button onclick="draft('+l.id+')">Draft revival</button><button class="secondary" onclick="editLead('+l.id+')">Edit</button><button class="secondary" onclick="removeLead('+l.id+')">Delete</button></div></article>').join('')}
$('leadForm').addEventListener('submit',async e=>{e.preventDefault();const d={};for(const f of fields){let v=$(f).type==='checkbox'?$(f).checked:$(f).value;if(f==='deal_value')v=Number(v||0);else if(v==='')v=null;if(v!==null)d[f]=v}try{await api(editingId?'/api/leads/'+editingId:'/api/leads',{method:editingId?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});resetForm();toast('Lead saved');refresh()}catch(e){toast(e.message)}});
function resetForm(){$('leadForm').reset();$('deal_value').value=0;editingId=null;$('formTitle').textContent='＋ Add a lead';$('saveBtn').textContent='Save lead';$('cancelEdit').classList.add('hidden')}
window.editLead=id=>{const l=leads.find(x=>x.id===id);editingId=id;fields.forEach(f=>{if($(f).type==='checkbox')$(f).checked=!!l[f];else $(f).value=l[f]??''});$('formTitle').textContent='Edit lead';$('saveBtn').textContent='Update lead';$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancelEdit').onclick=resetForm;
window.removeLead=async id=>{if(!confirm('Delete this lead and saved drafts?'))return;try{await api('/api/leads/'+id,{method:'DELETE'});toast('Lead deleted');refresh()}catch(e){toast(e.message)}};
window.draft=async id=>{const l=leads.find(x=>x.id===id),goal=prompt('What should this follow-up achieve?','Restart the conversation and ask if they are still interested');if(goal===null)return;try{const d=await api('/api/leads/'+id+'/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:'email',goal:goal,tone:'friendly'})});$('draftBox').classList.remove('hidden');$('draftBox').innerHTML='<b>Draft for '+esc(l.name)+'</b><br><br>'+(d.subject?'<b>Subject: '+esc(d.subject)+'</b><br><br>':'')+esc(d.body)+'<br><br><button id="copyDraft">Copy message</button> <span class="detail">Not sent</span>';$('copyDraft').onclick=()=>navigator.clipboard.writeText((d.subject?'Subject: '+d.subject+'\n\n':'')+d.body).then(()=>toast('Copied'));toast('Draft ready — review before sending')}catch(e){toast(e.message)}};
$('importForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData();f.append('file',$('csvFile').files[0]);try{const r=await api('/api/leads/import',{method:'POST',body:f});toast('Imported '+r.imported+' leads');$('importForm').reset();refresh()}catch(e){toast(e.message)}});
$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,250)});$('filter').addEventListener('change',refresh);refresh();
</script></body></html>
